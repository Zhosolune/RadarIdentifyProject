# 识别管道配置文件
# 定义了标准的CF-PW两阶段聚类识别流程配置

recognition_pipelines:
  # 默认识别流程 - 标准的CF-PW两阶段聚类
  default:
    name: "默认识别流程"
    description: "标准的CF-PW两阶段聚类识别流程"
    pipeline:
      - name: cf_clustering
        processor: cf_clustering
        input_from: [input]
        params:
          epsilon_CF: 2.0
          min_pts: 3

      - name: pw_clustering
        processor: pw_clustering
        input_from: [cf_clustering]
        params:
          epsilon_PW: 0.2
          min_pts: 3

# 默认管道配置
default_pipeline: "default"

# 管道参数范围约束
parameter_constraints:
  epsilon_CF:
    min: 0.1
    max: 10.0
    default: 2.0
  epsilon_PW:
    min: 0.01
    max: 2.0
    default: 0.2
  min_pts:
    min: 1
    max: 20
    default: 3
