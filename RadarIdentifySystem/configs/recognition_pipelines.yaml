# 识别管道配置文件
# 定义了标准的CF-PW两阶段聚类识别流程配置

recognition_pipelines:
  # 默认识别流程 - 标准的CF-PW两阶段聚类
  default:
    name: "默认识别流程"
    description: "标准的CF-PW两阶段聚类识别流程"
    pipeline:
      - name: cf_clustering
        processor: cf_clustering
        input_from: [input]
        params:
          epsilon_CF: 2.0
          min_pts: 3

      - name: pw_clustering
        processor: pw_clustering
        input_from: [cf_clustering]
        params:
          epsilon_PW: 0.2
          min_pts: 3

  # 聚类结果处理流程 - 单个聚类的完整处理链
  cluster_processing:
    name: "聚类结果处理流程"
    description: "对单个聚类结果执行图像生成、识别、特征提取的完整流程"
    pipeline:
      - name: plotting
        processor: cluster_plotting
        input_from: [input]
        params:
          band_name: "C波段"  # 默认使用C波段配置

      # 后续步骤待实现：图像识别、特征提取、结果保存
      # - name: recognition
      #   processor: image_recognition
      #   input_from: [plotting]
      #   params: {}

      # - name: extraction
      #   processor: feature_extraction
      #   input_from: [recognition]
      #   params: {}

# 默认管道配置
default_pipeline: "default"

# 管道参数范围约束
parameter_constraints:
  epsilon_CF:
    min: 0.1
    max: 10.0
    default: 2.0
  epsilon_PW:
    min: 0.01
    max: 2.0
    default: 0.2
  min_pts:
    min: 1
    max: 20
    default: 3
